{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2><i class="bi bi-journal-bookmark-fill"></i> My Issued Books</h2>
    {% if issued_books %}
        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>Book Title</th>
                    <th>Author</th>
                    <th>Issue Date</th>
                </tr>
            </thead>
            <tbody>
                {% for item in issued_books %}
                <tr>
                    <td>{{ item.book.title }}</td>
                    <td>{{ item.book.author }}</td>
                    <td>{{ item.issue_date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <div class="alert alert-warning mt-4" role="alert">
            You have not issued any books yet.
        </div>
    {% endif %}
</div>
{% endblock %}
