{% extends 'base.html' %}
{% block content %}
<h2>🔍 Search Books</h2>
<form method="get" class="input-group mb-3">
  <input type="text" name="query" class="form-control" placeholder="Enter book title" value="{{ query }}">
  <button class="btn btn-outline-secondary" type="submit">Search</button>
</form>

{% if results %}
  <ul class="list-group">
    {% for book in results %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      {{ book.title }} by {{ book.author }}
      <span class="badge bg-success rounded-pill">{{ book.quantity }} copies</span>
    </li>
    {% endfor %}
  </ul>
{% elif query %}
  <p>No results found.</p>
{% endif %}
{% endblock %}
<div class="mb-3">
  <label class="form-label">Genre</label>
  <input type="text" class="form-control" name="genre">
</div>
