<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Library Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar-custom {
      background-color: #343a40;
    }
    .navbar-custom .navbar-brand,
    .navbar-custom .nav-link {
      color: #ffffff;
    }
    footer {
      background-color: #343a40;
      color: white;
      padding: 10px 0;
      position: fixed;
      width: 100%;
      bottom: 0;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">📚 Library</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
          <li class="nav-item"><a class="nav-link" href="{% url 'add_book' %}">Add Book</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'issue_book' %}">Issue</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'my_issued_books' %}">My Books</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
          {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'signup' %}">Signup</a></li>
          {% endif %}
          {% if user.is_authenticated %}
          {% endif %}

        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer>
    <div>© 2025 Library Management System | Designed with ❤️</div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
